; Project scalability overrides.
;
; LUMEN IS MANDATORY ON EVERY QUALITY LEVEL.
; See Docs/architecture/adr-0001-lumen-mandatory.md. Engine defaults under
; [GlobalIlluminationQuality@0] and [ReflectionQuality@0] switch Lumen off; this file
; re-enables it and pays for low-end hardware with quality knobs instead.
; Consequence, accepted in that ADR: the minimum spec is a dedicated GPU (GTX 1060 / RX 580
; class). Integrated GPUs are out of scope.
;
; NOTE: cvar names and defaults must be re-verified against UE 5.8 — the bundled
; engine reference in Docs/engine-reference is a 5.7 snapshot. Verified 2026-11-09
; against Engine/Config/BaseScalability.ini: the engine only ships the foliage
; variant of the roughness knob. The generic r.Lumen.Reflections.MaxRoughnessToTrace
; is not ECVF_Scalability, so setting it here is rejected at startup.

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=4
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=24
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16

[GlobalIlluminationQuality@Cine]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.2

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.3

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.4

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.5

[ReflectionQuality@Cine]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.5
